---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zizisbe-frontend-deployment
  namespace: zizisbe
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zizisbe-frontend
  template:
    metadata:
      labels:
        app: zizisbe-frontend
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - compute
      imagePullSecrets:
        - name: github-registry
      containers:
        - name: zizisbe-frontend-container
          image: "ghcr.io/eliasdhcom/zizisbe-frontend:latest"
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Europe/Brussels"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
          ports:
            - containerPort: 4000
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
---